# Loss Function Experiments Matrix (E1 - E5)
base_config: "configs/roberta.yaml"

experiments:
  E1_cross_entropy:
    loss:
      type: "cross_entropy"
    description: "Unweighted standard Categorical Cross Entropy baseline"

  E2_weighted_cross_entropy:
    loss:
      type: "weighted_cross_entropy"
      # Inverse frequency or custom class weighting.
      # Default testing ratio: [1.0, 1.0, 1.5, 3.0] or dynamically computed from training distribution
      weights: "inverse_frequency"
      severe_boost_factor: 1.0
    description: "Class-weighted Cross Entropy to counteract minority severe class sparsity"

  E3_focal_loss:
    loss:
      type: "focal_loss"
      gamma: 2.0
      reduction: "mean"
    description: "Focal loss downweighting well-classified easy examples"

  E4_weighted_focal_loss:
    loss:
      type: "weighted_focal_loss"
      gamma: 2.0
      alpha: "balanced"
      reduction: "mean"
    description: "Class-weighted Focal loss combining hard-example mining with class imbalance reweighting"

  E5_ordinal_objective:
    loss:
      type: "ordinal_coral"
      num_classes: 4
    description: "Consistent Rank Logits (CORAL) ordinal objective respecting class ordering"
